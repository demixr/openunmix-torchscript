[project]
name = "openunmix-torchscript"
version = "0.1.0"
description = "Open-Unmix models for mobile — TorchScript (.ptl) and ExecuTorch (.pte)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.5",
    "openunmix>=1.3",
]

[project.optional-dependencies]
executorch = [
    "executorch>=0.5",
]

[project.scripts]
openunmix-torchscript = "openunmix_executorch:main"
